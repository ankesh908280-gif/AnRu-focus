<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Doubt Room - AnRu Focus</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bgGrad); }
    .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(15,12,41,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glassBorder); z-index: 100; box-shadow: 0 4px 30px rgba(0,0,0,0.3); }
    .chat-header-info { display: flex; align-items: center; gap: 12px; }
    .chat-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .online-pulse { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
    .admin-badge { display: none; background: rgba(248,113,113,0.2); color: var(--danger); border: 1px solid var(--danger); padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 10px rgba(248,113,113,0.4); animation: adminGlow 2s infinite; }

    .chat-area { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .msg-wrap { display: flex; flex-direction: column; max-width: 85%; animation: slideUpFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
    .msg-wrap.left { align-self: flex-start; }
    .msg-wrap.right { align-self: flex-end; align-items: flex-end; }
    
    .msg-sender { font-size: 11px; color: var(--textMuted); margin-bottom: 4px; padding: 0 4px; display: flex; align-items: center; gap: 6px; }
    .msg-level { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 6px; font-size: 9px; color: var(--warn); }
    
    .msg-bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; position: relative; word-wrap: break-word; transition: transform 0.2s; }
    .msg-wrap.left .msg-bubble { background: rgba(255,255,255,0.08); border: 1px solid var(--glassBorder); border-bottom-left-radius: 4px; backdrop-filter: blur(10px); }
    .msg-wrap.right .msg-bubble { background: var(--grad); border: 1px solid rgba(255,255,255,0.2); border-bottom-right-radius: 4px; color: #fff; box-shadow: var(--shadowSm); }
    .msg-bubble:hover { transform: scale(1.02); }
    .msg-time { font-size: 9px; color: rgba(255,255,255,0.5); text-align: right; margin-top: 6px; display: block; }

    .chat-photo-container { position: relative; margin-bottom: 6px; overflow: hidden; border-radius: 12px; border: 1px solid var(--glassBorder); cursor: pointer; }
    .chat-photo { width: 100%; max-width: 250px; display: block; filter: blur(15px); transition: filter 0.5s ease, transform 0.3s; transform: scale(1.05); }
    .chat-photo.revealed { filter: blur(0); transform: scale(1); }
    .photo-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s; pointer-events: none; }
    .chat-photo.revealed + .photo-overlay { opacity: 0; }
    .photo-overlay i { font-size: 24px; color: #fff; margin-bottom: 8px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
    .photo-overlay span { font-size: 11px; font-weight: 700; color: #fff; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 12px; }

    .msg-actions { position: absolute; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .msg-wrap:hover .msg-actions { opacity: 1; pointer-events: auto; }
    .msg-wrap.left .msg-actions { right: -70px; }
    .msg-wrap.right .msg-actions { left: -70px; }
    .action-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glassBorder); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .action-btn.report:hover { background: var(--warn); border-color: var(--warn); color: #000; transform: scale(1.1); }
    .action-btn.ban:hover { background: var(--danger); border-color: var(--danger); transform: scale(1.1); }

    .chat-input-area { padding: 15px 20px; background: rgba(15,12,41,0.9); backdrop-filter: blur(30px); border-top: 1px solid var(--glassBorder); display: flex; align-items: flex-end; gap: 10px; z-index: 100; }
    .input-wrapper { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--glassBorder); border-radius: 20px; display: flex; align-items: center; padding: 5px 15px; transition: 0.3s; }
    .input-wrapper:focus-within { border-color: var(--p1); background: rgba(255,255,255,0.08); box-shadow: 0 0 15px rgba(102,126,234,0.2); }
    .chat-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; font-family: 'Outfit'; padding: 10px 0; max-height: 100px; resize: none; outline: none; }
    .chat-input::placeholder { color: var(--textMuted); }
    .attach-btn { background: none; border: none; color: var(--textMuted); font-size: 18px; cursor: pointer; padding: 5px; transition: 0.2s; }
    .attach-btn:hover { color: var(--p3); transform: scale(1.1); }
    .send-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--grad); border: none; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; box-shadow: var(--shadowSm); transition: 0.3s; }
    .send-btn:hover { transform: scale(1.05) rotate(-10deg); box-shadow: var(--shadow); }
    .send-btn:active { transform: scale(0.95); }

    @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.7); } 70% { box-shadow: 0 0 0 8px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
    @keyframes adminGlow { 0%, 100% { box-shadow: 0 0 10px rgba(248,113,113,0.4); } 50% { box-shadow: 0 0 20px rgba(248,113,113,0.8); } }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="chat-header">
    <div class="chat-header-info">
      <button class="btn-icon" onclick="window.location.href='index.html'" title="Back to App">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="chat-title">Live Doubt Room</div>
          <div class="online-pulse"></div>
        </div>
        <div style="font-size:11px; color:var(--textMuted); margin-top:2px;">Discuss concepts. Earn Respect.</div>
      </div>
    </div>
    <div class="admin-badge" id="godModeBadge">👑 Admin God Mode</div>
  </div>

  <!-- Chat Messages Area -->
  <div class="chat-area" id="chatContainer">
    <!-- Messages will be injected here by chat.js -->
  </div>

  <!-- Chat Input Area -->
  <div class="chat-input-area">
    <input type="file" id="chatPhotoInput" accept="image/*" style="display:none" onchange="handleChatPhotoUpload(event)">
    <button class="attach-btn" id="attachBtn" onclick="window.tryAttachPhoto()" title="Attach Photo (Requires Lvl 5)">
      <i class="fa-solid fa-image"></i>
    </button>
    <div class="input-wrapper">
      <textarea class="chat-input" id="msgInput" rows="1" placeholder="Type your doubt here... (Profanity blocked)"></textarea>
    </div>
    <button class="send-btn" onclick="window.mockSendMessage()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

  <!-- 🔍 FULLSCREEN IMAGE ZOOM VIEWER -->
  <div id="imageViewer" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; align-items:center; justify-content:center; flex-direction:column;">
      <button onclick="closeImageViewer()" style="position:absolute; top:20px; right:20px; background:var(--danger); border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; z-index:10001; box-shadow: 0 0 15px rgba(248,113,113,0.5);">✕</button>
      
      <div style="overflow:auto; width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding: 20px;">
           <img id="fullscreenImg" src="" style="max-width:200%; max-height:200%; object-fit:contain; transition: transform 0.3s; transform: scale(1);" >
      </div>
      
      <!-- Zoom Controls -->
      <div style="position:absolute; bottom:40px; display:flex; gap:20px; background:rgba(255,255,255,0.1); padding:10px 20px; border-radius:30px; backdrop-filter:blur(10px);">
          <button onclick="zoomImg(0.5)" style="background:var(--p1); border:none; color:white; width:45px; height:45px; border-radius:50%; font-size:24px; box-shadow:0 5px 15px rgba(102,126,234,0.5);">➕</button>
          <button onclick="zoomImg(-0.5)" style="background:var(--p1); border:none; color:white; width:45px; height:45px; border-radius:50%; font-size:24px; box-shadow:0 5px 15px rgba(102,126,234,0.5);">➖</button>
      </div>
  </div>

  <!-- 🍞 Toast Notification Alert -->
  <div class="toast" id="toast"></div>

  <!-- Audio Elements -->
  <audio id="sfxClick" src="https://assets.mixkit.co/sfx/preview/mixkit-sci-fi-click-900.mp3"></audio>
  <audio id="sfxSend" src="https://assets.mixkit.co/sfx/preview/mixkit-fast-small-sweep-transition-166.mp3"></audio>

  <!-- Firebase Cloud Engine -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <script src="app.js"></script>
  <script src="chat.js"></script>
</body>
</html>

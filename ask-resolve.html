<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Ask & Resolve - AnRu Focus</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: var(--bgGrad); }
    
    .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(15,12,41,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glassBorder); z-index: 100; box-shadow: 0 4px 30px rgba(0,0,0,0.3); }
    .chat-header-info { display: flex; align-items: center; gap: 12px; }
    .chat-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .admin-badge { display: none; background: rgba(248,113,113,0.2); color: var(--danger); border: 1px solid var(--danger); padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 10px rgba(248,113,113,0.4); animation: adminGlow 2s infinite; }

    .feed-area { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; padding-bottom: 40px; }
    .feed-area::-webkit-scrollbar { display: none; }

    /* Cards */
    .doubt-card { background: rgba(255,255,255,0.05); border: 1px solid var(--glassBorder); border-radius: 16px; padding: 16px; position: relative; animation: slideUpFade 0.4s ease; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .doubt-card.pending { border-left: 4px solid var(--warn); background: linear-gradient(135deg, rgba(251,191,36,0.05), transparent); }
    .doubt-card.resolved { border-left: 4px solid var(--success); background: linear-gradient(135deg, rgba(74,222,128,0.05), transparent); }

    .d-status { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 12px; display: inline-flex; align-items: center; margin-bottom: 10px; }
    .pending .d-status { background: rgba(251,191,36,0.2); color: var(--warn); }
    .resolved .d-status { background: rgba(74,222,128,0.2); color: var(--success); }

    .d-question { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.4; margin-bottom: 12px; }
    .d-answer-box { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; border: 1px solid rgba(74,222,128,0.2); margin-top: 10px; }
    .d-answer-box .teacher-name { font-size: 11px; color: var(--success); font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .d-answer-box .answer-text { font-size: 14px; color: #ddd; line-height: 1.4; }

    /* Admin Actions */
    .d-admin-actions { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

    /* Student Input Area */
    .ask-input-area { padding: 15px 20px calc(15px + env(safe-area-inset-bottom, 10px)); background: rgba(15,12,41,0.95); backdrop-filter: blur(30px); border-top: 1px solid var(--glassBorder); display: flex; flex-direction: column; gap: 10px; z-index: 100; }
    .ask-input-area textarea { padding: 12px 16px; border-radius: 16px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glassBorder); resize: none; font-family: 'Outfit'; font-size: 14px; }
    .ask-input-area textarea::placeholder { color: rgba(255,255,255,0.4); }

    /* Admin Reply Modal */
    #replyModal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; }
    #replyModal.open { display: flex; animation: fadeIn 0.2s ease; }
    .reply-box { background: var(--glass2); border: 1px solid var(--glassBorder); border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; position: relative; }

    @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="chat-header">
    <div class="chat-header-info">
      <button class="btn-icon" onclick="window.location.href='index.html'">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="chat-title">Anonymous Doubts</div>
        </div>
        <div style="font-size:11px; color:var(--textMuted); margin-top:2px;">100% Safe & Private Q&A</div>
      </div>
    </div>
    <div class="admin-badge" id="adminBadge">👑 Admin</div>
  </div>

  <div class="feed-area" id="doubtsContainer">
    <div style="text-align:center; margin-top: 50px;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--p1);"></i>
      <p style="font-size: 12px; color: var(--textMuted); margin-top: 10px;">Loading questions...</p>
    </div>
  </div>

  <!-- Student Input Area -->
  <div class="ask-input-area">
    <div style="font-size: 11px; color: var(--textMuted); display: flex; align-items: center; justify-content: space-between;">
        <span><i class="fa-solid fa-user-secret"></i> Your identity is hidden.</span>
        <span style="color:var(--warn)">Profanity block active.</span>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-end;">
      <textarea id="qInput" rows="2" placeholder="Ask your doubt without any hesitation..."></textarea>
      <button class="btn-sm" style="height: 100%; padding: 0 20px; font-size: 16px; border-radius: 16px;" onclick="postQuestion()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- Admin Reply Modal -->
  <div id="replyModal">
      <div class="reply-box">
          <button onclick="closeReplyModal()" style="position:absolute; top:15px; right:15px; background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
          <div style="font-size:18px; font-weight:700; margin-bottom:15px; font-family:'Playfair Display';">Resolve Doubt</div>
          <p id="replyQText" style="font-size:13px; color:var(--textSub); margin-bottom:15px; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px;"></p>
          <input type="hidden" id="replyQId">
          <textarea id="rInput" rows="4" style="width:100%; background:rgba(255,255,255,0.05); color:#fff; border:1px solid var(--glassBorder); border-radius:12px; padding:10px; resize:none; margin-bottom:15px;" placeholder="Type your answer here..."></textarea>
          <button class="btn-grad" style="width:100%; border-radius:12px;" onclick="submitResolution()">Publish Answer ✅</button>
      </div>
  </div>

  <div class="toast" id="toast"></div>
  <audio id="sfxClick" src="https://assets.mixkit.co/sfx/preview/mixkit-sci-fi-click-900.mp3"></audio>
  <audio id="sfxSend" src="https://assets.mixkit.co/sfx/preview/mixkit-fast-small-sweep-transition-166.mp3"></audio>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script src="ask.js"></script>

</body>
</html>
